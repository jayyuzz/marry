    <linearGradient id="halo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5d060"/>
      <stop offset="50%" stop-color="#ffe88a"/>
      <stop offset="100%" stop-color="#c89010"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-10%" width="130%" height="130%">
