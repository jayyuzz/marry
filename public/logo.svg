      <stop offset="0%" stop-color="#eceef8"/>
      <stop offset="100%" stop-color="#d6daea"/>
    </linearGradient>
    <linearGradient id="wing" x1="0%" y1="20%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8c8ff"/>
      <stop offset="100%" stop-color="#4a68d0"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
